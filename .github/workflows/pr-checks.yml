name: Pull Request Checks

on:
  pull_request:
    branches: [Master, develop]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel previous runs if new commits are pushed
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Quality Gate 1: Code Quality
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  # Quality Gate 2: Formatting
  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  # Quality Gate 3: Type Safety
  type-check:
    name: TypeScript Type Checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit

  # Quality Gate 3: Build Verification
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://dummy.convex.cloud' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  # Quality Gate 4: Bundle Analysis
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and analyze bundle
        run: bun run build
        env:
          ANALYZE: true
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://dummy.convex.cloud' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: .next/analyze/

  # Summary Job - All checks must pass
  all-checks-complete:
    name: All Checks Complete
    runs-on: ubuntu-latest
    needs: [code-quality, formatting, type-check, build-check, bundle-analysis]
    if: always() && github.event.pull_request.draft == false

    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "success" &&
                "${{ needs.formatting.result }}" == "success" &&
                "${{ needs.type-check.result }}" == "success" &&
                "${{ needs.build-check.result }}" == "success" &&
                "${{ needs.bundle-analysis.result }}" == "success" ]]; then
            echo "✅ All quality gates passed!"
            echo "🚀 This PR is ready for review and merge."
          else
            echo "❌ Some quality gates failed."
            echo "Please fix the issues before merging."
            exit 1
          fi

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              codeQuality: '${{ needs.code-quality.result }}',
              formatting: '${{ needs.formatting.result }}',
              typeCheck: '${{ needs.type-check.result }}',
              buildCheck: '${{ needs.build-check.result }}',
              bundleAnalysis: '${{ needs.bundle-analysis.result }}'
            };

            const allPassed = Object.values(results).every(result => result === 'success');
            const emoji = allPassed ? '✅' : '❌';
            const status = allPassed ? 'All checks passed!' : 'Some checks failed.';

            const body = `## ${emoji} Quality Gate Results

            | Check | Status |
            |-------|--------|
            | Code Quality | ${results.codeQuality === 'success' ? '✅' : '❌'} |
            | Formatting | ${results.formatting === 'success' ? '✅' : '❌'} |
            | Type Safety | ${results.typeCheck === 'success' ? '✅' : '❌'} |
            | Build Check | ${results.buildCheck === 'success' ? '✅' : '❌'} |
            | Bundle Analysis | ${results.bundleAnalysis === 'success' ? '✅' : '❌'} |

            **${status}**

            ${allPassed ? '🚀 This PR is ready for review!' : '🔧 Please fix the failing checks before merging.'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
